# LiteLLM Proxy routing aliases. Applications should request one of these
# logical names instead of coupling an agent to a provider model.
model_list:
  - model_name: supervisor-model
    litellm_params:
      model: azure/${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/AZURE_OPENAI_API_VERSION

  - model_name: supervisor-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-latest
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: programmer-model
    litellm_params:
      model: anthropic/claude-3-5-sonnet-latest
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: file-reader-model
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: marketing-model
    litellm_params:
      model: azure/${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/AZURE_OPENAI_API_VERSION

  - model_name: marketing-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 1
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    - supervisor-model:
        - supervisor-haiku
        - programmer-model
        - file-reader-model
    - programmer-model:
        - file-reader-model
    - file-reader-model:
        - marketing-flash
    - marketing-model:
        - marketing-flash
  retry_policy:
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  set_verbose: false
