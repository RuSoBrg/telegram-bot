# LiteLLM Proxy routing aliases and fallback rules
# Logical model names decouple application agents from provider endpoints.

model_list:
  # Supervisor: Primary GPT-4o, Secondary Claude 3 Haiku
  - model_name: supervisor-model
    litellm_params:
      model: azure/${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/AZURE_OPENAI_API_VERSION

  - model_name: supervisor-haiku
    litellm_params:
      model: anthropic/claude-3-haiku-20240307
      api_key: os.environ/ANTHROPIC_API_KEY

  # Programmer Agent: Claude 3.5 Sonnet (20240620)
  - model_name: programmer-model
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20240620
      api_key: os.environ/ANTHROPIC_API_KEY

  # Large Files / Extended Context: Gemini 1.5 Pro (2M token window)
  - model_name: file-reader-model
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # Marketing Agent: Flash and GPT-4o
  - model_name: marketing-model
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: marketing-gpt4o
    litellm_params:
      model: azure/${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/AZURE_OPENAI_API_VERSION

  - model_name: marketing-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 3
  retry_after: 1
  timeout: 60
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    # Se GPT-4o der RateLimit ou falhar, salta para Claude 3.5 Sonnet e depois Haiku
    - supervisor-model:
        - programmer-model
        - supervisor-haiku
    - programmer-model:
        - supervisor-model
        - file-reader-model
    - file-reader-model:
        - programmer-model
        - marketing-flash
    - marketing-model:
        - marketing-gpt4o
        - marketing-flash
    - marketing-flash:
        - marketing-gpt4o
  context_window_fallbacks:
    - programmer-model:
        - file-reader-model
    - supervisor-model:
        - file-reader-model
    - marketing-model:
        - file-reader-model
  retry_policy:
    RateLimitErrorRetries: 3
    TimeoutErrorRetries: 2
    InternalServerErrorRetries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  set_verbose: false
