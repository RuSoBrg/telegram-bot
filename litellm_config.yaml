# LiteLLM Proxy routing aliases and fallback rules.
# The application can address these logical names through the LiteLLM proxy.

model_list:
  # Supervisor: Azure OpenAI -> Groq -> OpenRouter.
  - model_name: supervisor-model
    litellm_params:
      model: azure/${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/AZURE_OPENAI_API_VERSION

  - model_name: supervisor-groq
    litellm_params:
      model: groq/llama-3.1-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: supervisor-openrouter
    litellm_params:
      model: openrouter/anthropic/claude-3-haiku
      api_key: os.environ/OPENROUTER_API_KEY

  # Programmer Agent: OpenRouter Claude -> Azure OpenAI -> Groq.
  - model_name: programmer-model
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: programmer-azure
    litellm_params:
      model: azure/${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/AZURE_OPENAI_API_VERSION

  # Large files: Gemini 1.5 Pro -> Azure GPT-4o.
  - model_name: file-reader-model
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY
      request_timeout: 120

  - model_name: file-reader-azure
    litellm_params:
      model: azure/${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: os.environ/AZURE_OPENAI_API_VERSION

  # Marketing: Groq -> Gemini Flash.
  - model_name: marketing-model
    litellm_params:
      model: groq/llama-3.1-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: marketing-gemini
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  # Fail over immediately for exhausted or invalid credentials.
  num_retries: 0
  retry_after: 2
  timeout: 60
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    - supervisor-model:
        - supervisor-groq
        - supervisor-openrouter
    - programmer-model:
        - programmer-azure
    - file-reader-model:
        - file-reader-azure
    - marketing-model:
        - marketing-gemini
  retry_policy:
    RateLimitErrorRetries: 0
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  set_verbose: false
