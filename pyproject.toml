[project]
name = "ai-workspace"
version = "0.1.0"
description = "LangGraph workflow for the Workspace AI agents"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain-core",
    "langchain-google-genai",
    "google-genai",
    "python-telegram-bot",
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "python-dotenv",
    "pydantic",
    "psycopg[binary]",
    "python-docx",
    "python-pptx",
    "reportlab",
    "tavily-python",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false
