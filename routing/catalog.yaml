# Modelos validados. Gemini (Pro e Flash) e Groq possuem free-tiers de API. Ollama e local.
models:
  gemini_pro: {provider: google_genai, model_id: gemini-1.5-pro, env_var: GEMINI_API_KEY, capabilities: [structured_output, tools, long_context], timeout_s: 60, score: 100}
  gemini_flash: {provider: google_genai, model_id: gemini-1.5-flash, env_var: GEMINI_API_KEY, capabilities: [structured_output, tools], timeout_s: 30, score: 95}
  groq_llama: {provider: groq, model_id: llama-3.1-70b-versatile, env_var: GROQ_API_KEY, capabilities: [tools], timeout_s: 30, score: 90}
  azure_gpt4o: {provider: azure_openai, model_id: "${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}", env_var: AZURE_OPENAI_API_KEY, capabilities: [structured_output, tools, long_context], timeout_s: 45, score: 85, api_base_env: AZURE_OPENAI_ENDPOINT, api_version_env: AZURE_OPENAI_API_VERSION}
  openai_gpt4o: {provider: openai, model_id: gpt-4o, env_var: OPENAI_API_KEY, capabilities: [structured_output, tools, long_context], timeout_s: 45, score: 85}
  openai_mini: {provider: openai, model_id: gpt-4o-mini, env_var: OPENAI_API_KEY, capabilities: [structured_output, tools], timeout_s: 30, score: 80}
  ollama_local: {provider: ollama, model_id: llama3.1:8b, env_var: OLLAMA_BASE_URL, capabilities: [tools], timeout_s: 60, score: 10, base_url_env: OLLAMA_BASE_URL}

tasks:
  supervisor: [gemini_pro, gemini_flash, groq_llama, azure_gpt4o, openai_gpt4o, ollama_local]
  engenharia: [gemini_pro, groq_llama, azure_gpt4o, openai_gpt4o, gemini_flash, ollama_local]
  marketing: [gemini_pro, gemini_flash, groq_llama, azure_gpt4o, openai_gpt4o, ollama_local]
  vida: [gemini_flash, gemini_pro, groq_llama, openai_mini, azure_gpt4o, openai_gpt4o, ollama_local]
  formador: [gemini_pro, gemini_flash, groq_llama, azure_gpt4o, openai_gpt4o, ollama_local]
  generalista: [gemini_flash, gemini_pro, groq_llama, openai_mini, azure_gpt4o, openai_gpt4o, ollama_local]
  file_reader: [gemini_pro, azure_gpt4o, openai_gpt4o, ollama_local]
  revisor: [gemini_pro, gemini_flash, groq_llama, azure_gpt4o, openai_gpt4o, ollama_local]
  