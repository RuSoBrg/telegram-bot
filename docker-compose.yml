services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_workspace}
      POSTGRES_USER: ${POSTGRES_USER:-ai_workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "bot.py"]
    env_file:
      - .env
    environment:
      PORT: "8000"
      WORKFLOW_DB_PATH: ${WORKFLOW_DB_PATH:?configure WORKFLOW_DB_PATH}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:?configure TELEGRAM_WEBHOOK_BASE_URL}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      OBJECT_STORAGE_PATH: /app/data
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "bot:8000"
      - "--domain=${NGROK_DOMAIN:?configure NGROK_DOMAIN}"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:?configure NGROK_AUTHTOKEN}
    depends_on:
      bot:
        condition: service_healthy
