services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8000"
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:?configure TELEGRAM_WEBHOOK_URL}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?configure TELEGRAM_WEBHOOK_SECRET}
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-gcs}
    expose:
      - "8000"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?configure TUNNEL_TOKEN}
    depends_on:
      - bot
    restart: unless-stopped
